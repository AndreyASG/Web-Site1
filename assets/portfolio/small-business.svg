<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Пример дизайна: сайт небольшой компании">
  <!-- Демонстрационный макет. Замените этот файл скриншотом реального проекта 1200×800 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000513"/><stop offset="1" stop-color="#061433"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2A24"/><stop offset="1" stop-color="#0F1714"/></linearGradient>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2A54B"/><stop offset="1" stop-color="#9C5B22"/></linearGradient>
    <clipPath id="win"><rect x="110" y="90" width="980" height="660" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="160" cy="720" r="280" fill="#00D4FF" opacity=".1"/>
  <g clip-path="url(#win)">
    <rect x="110" y="90" width="980" height="660" fill="#F4F4F1"/>
    <rect x="110" y="90" width="980" height="44" fill="#E4E4DF"/>
    <circle cx="140" cy="112" r="6" fill="#C8C8C1"/><circle cx="160" cy="112" r="6" fill="#C8C8C1"/><circle cx="180" cy="112" r="6" fill="#C8C8C1"/>
    <rect x="420" y="102" width="360" height="20" rx="10" fill="#F4F4F1"/>
    <!-- первый экран -->
    <rect x="110" y="134" width="980" height="380" fill="url(#hero)"/>
    <g font-family="Arial, sans-serif">
      <text x="160" y="186" font-size="20" font-weight="bold" fill="#FFFFFF">МАСТЕРСКАЯ</text>
      <text x="640" y="184" font-size="14" fill="#C9D3CC">Услуги</text><text x="712" y="184" font-size="14" fill="#C9D3CC">Цены</text><text x="772" y="184" font-size="14" fill="#C9D3CC">Работы</text>
      <rect x="900" y="164" width="140" height="34" rx="8" fill="#E2A54B"/>
      <text x="970" y="186" font-size="13" font-weight="bold" fill="#1B2A24" text-anchor="middle">Позвонить</text>
      <text x="160" y="290" font-size="44" font-weight="bold" fill="#FFFFFF">Мебель на заказ</text>
      <text x="160" y="342" font-size="44" font-weight="bold" fill="#FFFFFF">по вашим размерам</text>
      <text x="160" y="388" font-size="17" fill="#C9D3CC">Кухни, шкафы и гардеробные. Замер и проект бесплатно.</text>
      <rect x="160" y="420" width="220" height="52" rx="10" fill="#E2A54B"/>
      <text x="270" y="452" font-size="16" font-weight="bold" fill="#1B2A24" text-anchor="middle">Рассчитать стоимость</text>
    </g>
    <rect x="700" y="226" width="340" height="250" rx="16" fill="url(#img)"/>
    <rect x="740" y="270" width="120" height="170" rx="6" fill="#F4E3C6" opacity=".9"/>
    <rect x="876" y="270" width="124" height="80" rx="6" fill="#F4E3C6" opacity=".9"/>
    <rect x="876" y="362" width="124" height="78" rx="6" fill="#F4E3C6" opacity=".7"/>
    <!-- блок услуг -->
    <g font-family="Arial, sans-serif">
      <text x="160" y="572" font-size="24" font-weight="bold" fill="#1B2A24">Что мы делаем</text>
      <rect x="160" y="596" width="280" height="120" rx="14" fill="#FFFFFF"/>
      <text x="184" y="640" font-size="17" font-weight="bold" fill="#1B2A24">Кухни</text>
      <text x="184" y="668" font-size="14" fill="#6B756F">Проект под размеры кухни</text>
      <rect x="460" y="596" width="280" height="120" rx="14" fill="#FFFFFF"/>
      <text x="484" y="640" font-size="17" font-weight="bold" fill="#1B2A24">Шкафы-купе</text>
      <text x="484" y="668" font-size="14" fill="#6B756F">Встроенные и корпусные</text>
      <rect x="760" y="596" width="280" height="120" rx="14" fill="#FFFFFF"/>
      <text x="784" y="640" font-size="17" font-weight="bold" fill="#1B2A24">Гардеробные</text>
      <text x="784" y="668" font-size="14" fill="#6B756F">Системы хранения</text>
    </g>
  </g>
  <rect x="110" y="90" width="980" height="660" rx="18" fill="none" stroke="#1E3358" stroke-width="2"/>
</svg>
