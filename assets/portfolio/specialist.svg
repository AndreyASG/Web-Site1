<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Пример дизайна: персональный сайт частного специалиста">
  <!-- Демонстрационный макет. Замените этот файл скриншотом реального проекта 1200×800 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061433"/><stop offset="1" stop-color="#000513"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9B8A4"/><stop offset="1" stop-color="#8E7A66"/></linearGradient>
    <clipPath id="win"><rect x="110" y="90" width="980" height="660" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="260" fill="#0A63FF" opacity=".16"/>
  <g clip-path="url(#win)">
    <rect x="110" y="90" width="980" height="660" fill="#F6F2EC"/>
    <rect x="110" y="90" width="980" height="44" fill="#EAE3D9"/>
    <circle cx="140" cy="112" r="6" fill="#CDBFAE"/><circle cx="160" cy="112" r="6" fill="#CDBFAE"/><circle cx="180" cy="112" r="6" fill="#CDBFAE"/>
    <rect x="420" y="102" width="360" height="20" rx="10" fill="#F6F2EC"/>
    <!-- навигация -->
    <text x="160" y="186" font-family="Georgia, serif" font-size="22" fill="#2F3B33">Ваше имя</text>
    <g font-family="Arial, sans-serif" font-size="14" fill="#5E6A61">
      <text x="640" y="184">Обо мне</text><text x="726" y="184">Услуги</text><text x="802" y="184">Стоимость</text>
    </g>
    <rect x="910" y="164" width="130" height="34" rx="17" fill="#4F6B57"/>
    <text x="975" y="186" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">Записаться</text>
    <!-- первый экран -->
    <text x="160" y="300" font-family="Georgia, serif" font-size="46" fill="#22302A">Психолог для</text>
    <text x="160" y="356" font-family="Georgia, serif" font-size="46" fill="#22302A">взрослых и пар</text>
    <text x="160" y="404" font-family="Arial, sans-serif" font-size="17" fill="#5E6A61">Онлайн и очно. Первая встреча - знакомство</text>
    <text x="160" y="430" font-family="Arial, sans-serif" font-size="17" fill="#5E6A61">с вашим запросом и планом работы.</text>
    <rect x="160" y="466" width="210" height="52" rx="26" fill="#4F6B57"/>
    <text x="265" y="498" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">Выбрать время</text>
    <rect x="388" y="466" width="160" height="52" rx="26" fill="none" stroke="#4F6B57" stroke-width="1.5"/>
    <text x="468" y="498" font-family="Arial, sans-serif" font-size="16" fill="#4F6B57" text-anchor="middle">Цены</text>
    <!-- фото-плейсхолдер -->
    <rect x="690" y="236" width="350" height="420" rx="180" fill="url(#photo)"/>
    <circle cx="865" cy="380" r="62" fill="#E9DED0" opacity=".85"/>
    <path d="M760 620 Q865 470 970 620 Z" fill="#E9DED0" opacity=".85"/>
    <!-- карточки -->
    <g font-family="Arial, sans-serif">
      <rect x="160" y="580" width="150" height="110" rx="14" fill="#FFFFFF"/>
      <text x="180" y="622" font-size="15" fill="#22302A">Тревога</text><text x="180" y="646" font-size="13" fill="#8A948C">и стресс</text>
      <rect x="326" y="580" width="150" height="110" rx="14" fill="#FFFFFF"/>
      <text x="346" y="622" font-size="15" fill="#22302A">Отношения</text><text x="346" y="646" font-size="13" fill="#8A948C">в паре</text>
      <rect x="492" y="580" width="150" height="110" rx="14" fill="#FFFFFF"/>
      <text x="512" y="622" font-size="15" fill="#22302A">Самооценка</text><text x="512" y="646" font-size="13" fill="#8A948C">и границы</text>
    </g>
  </g>
  <rect x="110" y="90" width="980" height="660" rx="18" fill="none" stroke="#1E3358" stroke-width="2"/>
</svg>
